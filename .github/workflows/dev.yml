# ---------------------------------------------------------------------------
# DEV deploy -> the shared AWS EC2 box.        [1 of 2 workflows in this repo]
#
#   main  -> dev  (AWS EC2)       THIS FILE
#   prod  -> prod (GCP Cloud Run) .github/workflows/prod.yml
#
# MANUAL ONLY. Run from the Actions tab when you want a dev deploy.
# The password check is an extra guard; it is not a replacement for GitHub
# repository permissions. workflow_dispatch inputs are not masked.
#
# ONE-TIME SETUP:
#   1. Settings -> Environments -> create environment `development`.
#   2. Add environment secret `DEPLOY_PASSWORD`.
#   3. Keep the existing EC2/GHCR secrets configured as before.
# ---------------------------------------------------------------------------

name: Build & Deploy (mandir-web)

on:
  # MANUAL ONLY - deliberately no `push:` trigger.
  workflow_dispatch:
    inputs:
      PASS:
        description: 'Enter deployment password'
        required: true
        type: number

concurrency:
  group: deploy-mandir-web
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/tasqbots/jainerp-mandir-web

jobs:
  # Validate the password before any checks, image build, or deployment.
  password-check:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    steps:
      - name: Validate deployment password
        env:
          PASS_SECRET: ${{ secrets.DEPLOY_PASSWORD }}
          PASS_INPUT: ${{ inputs.PASS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PASS_SECRET" ]]; then
            echo "::error::DEPLOY_PASSWORD is not configured in the development environment secrets."
            exit 1
          fi
          if [[ "$PASS_INPUT" != "$PASS_SECRET" ]]; then
            echo "::error::Incorrect deployment password. Workflow stopped."
            exit 1
          fi
          echo "Deployment password accepted."  >>$GITHUB_SUMMARY

  # Run checks only after the password check succeeds.
  verify:
    needs: password-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Buildx is what makes the GitHub Actions layer cache below usable.
      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Layer cache includes intermediate stages (including builder
          # node_modules), reducing repeated npm installs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy on EC2 (mandir-web only)
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          trap 'rm -f /tmp/deploy_key' EXIT

          # The remote body is a here-doc so it can hold a lock, retry the
          # recreate and health-gate the result.
          #
          # The lock serializes deploys from all repos sharing this EC2 box.
          # Do not run `docker system prune` inline with a deploy.
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "$EC2_USER@$EC2_HOST" \
            GHCR_PAT="$GHCR_PAT" GHCR_USER="$GHCR_USER" TAG="${{ github.sha }}" 'bash -s' <<'REMOTE'
          set -uo pipefail
          cd /opt/jainerp

          # Serialize with every other repo's deploy on this box.
          exec 9>/var/lock/jainerp-deploy.lock
          if ! flock -w 600 9; then
            echo "::error::timed out waiting for the shared deploy lock"
            exit 1
          fi

          # Fail immediately if registry authentication is broken.
          if ! echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; then
            echo "::error::docker login to ghcr.io failed. Check GHCR_PAT, its read:packages permission, and GHCR_USER."
            exit 1
          fi

          # Deploy the exact image built by this workflow, not a moving :latest.
          export MANDIR_WEB_TAG="$TAG"
          COMPOSE="docker compose -f docker-compose.aws.yml --env-file .env.aws"
          if ! $COMPOSE pull mandir-web; then
            echo "::error::could not pull $TAG. Check registry access and whether the tag exists."
            exit 1
          fi

          # Recreate, retrying once on a transient container race.
          up() { $COMPOSE up -d --force-recreate --no-deps --remove-orphans mandir-web; }
          if ! up; then
            echo "compose up failed - retrying once after 5s..."
            sleep 5
            if ! up; then
              echo "::error::compose up failed twice"
              exit 1
            fi
          fi

          # Health-gate the new service.
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS -m 5 http://localhost:8081/ >/dev/null 2>&1; then
              ok=1
              echo "health OK after ${i} tries"
              break
            fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "::error::mandir-web did not become healthy after deploy"
            docker ps -a --filter name=jainerp-mandir-web --format "{{.Names}} {{.Status}}"
            docker logs --tail 40 jainerp-mandir-web 2>&1 | grep -viE "password|secret" || true
            exit 1
          fi

          # Prove the running container is the image this run pushed.
          running="$(docker inspect --format '{{.Config.Image}}' jainerp-mandir-web 2>/dev/null || echo unknown)"
          echo "running image: $running"
          case "$running" in
            *:"$TAG") echo "deploy healthy, serving $TAG." ;;
            *) echo "::error::jainerp-mandir-web is serving $running, expected tag $TAG"; exit 1 ;;
          esac

          # Persist the tag so later compose invocations and reboots keep using it.
          touch .env.aws
          sed -i '/^MANDIR_WEB_TAG=/d' .env.aws
          echo "MANDIR_WEB_TAG=$TAG" >> .env.aws
          echo "pinned MANDIR_WEB_TAG=$TAG in .env.aws"
          REMOTE
