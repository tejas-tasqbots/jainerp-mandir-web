# ---------------------------------------------------------------------------
# PRODUCTION deploy -> Cloud Run, asia-south1.   [1 of 2 workflows in this repo]
#
#   main  -> dev  (AWS EC2)      .github/workflows/dev.yml
#   prod  -> prod (GCP Cloud Run) THIS FILE
#
# Merge main into `prod` when you want to ship. Nothing else deploys here.
#
# SELF-CONTAINED ON PURPOSE. This used to call a reusable workflow, which meant
# four workflows in the Actions list for two actual jobs, and a vendored copy of
# the reusable one in every repo anyway (private repos cannot share reusable
# workflows on this plan). Inlined: one file, one job, nothing to cross-check.
#
# APPROVAL GATED. The `production` environment requires a reviewer, so a push to
# `prod` queues and burns NO Actions minutes until you approve it. That gate is
# also load-bearing for auth: the WIF binding in gcp/modules/wif-github matches
# attribute.repo_env = "<owner>/<repo>:production", so a job without this
# `environment:` line gets no environment claim in its OIDC token and cannot
# authenticate to GCP at all.
#
# The docker build runs on CLOUD BUILD, not this runner - see cloudbuild.yaml.
# ---------------------------------------------------------------------------

name: Deploy to production (GCP)

on:
  # MANUAL ONLY - there is deliberately no `push:` trigger. See dev.yml for why
  # (GitHub Free has no required-reviewers rule on private repos, so an
  # environment gate is not available and pushes would deploy unattended).
  #
  # Run this from the Actions tab and pick the `prod` branch in the dialog.
  # Merge main -> prod first; the branch is still the record of what is in
  # production, it just no longer triggers by itself.
  workflow_dispatch:
    inputs:
      PASS:
        description: "Enter the deployment password"
        required: true
        type: number

concurrency:
  # Per service: two merges in quick succession must not race each other
  # through the traffic shift.
  group: deploy-prod-mandir-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write # required for WIF; nothing else needs write

    steps:
      # This is an extra check, not a replacement for GitHub access controls.
      # Create an environment secret named DEPLOY_PASSWORD in the "production"
      # environment before running this workflow.
      - name: Validate deployment password
        env:
          EXPECTED_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          PROVIDED_PASSWORD: ${{ inputs.PASS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_PASSWORD" ]; then
            echo "::error::DEPLOY_PASSWORD is not configured in the production environment."
            exit 1
          fi
          if [ "$PROVIDED_PASSWORD" != "$EXPECTED_PASSWORD" ]; then
            echo "::error::Incorrect deployment password. Deployment cancelled."
            exit 1
          fi
          echo "Deployment password accepted."  >>$GITHUB_SUMMARY

      - name: Check the caller passed everything
        env:
          IMAGE_REPO: ${{ secrets.GCP_IMAGE_REPO }}
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
        run: |
          set -euo pipefail
          missing=0
          for v in IMAGE_REPO WIF_PROVIDER DEPLOY_SA; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty. Set the repository variable that feeds it - see doc-v2/GCP_CICD_Runbook.md §3."
              missing=1
            fi
          done
          [ "$missing" = "0" ]

      - uses: actions/checkout@v4


      - name: Authenticate to Google Cloud (keyless)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: tsq-jainerp-prod

      - name: Pin gcloud to the target project
        # google-github-actions/auth writes CLOUDSDK_CORE_PROJECT into
        # $GITHUB_ENV, set to the SERVICE ACCOUNT's project (tsq-ci, where the
        # deploy identities live). That beats both `gcloud config set project`
        # AND a job-level `env:` block, because a $GITHUB_ENV write overrides
        # job env for every later step. So setup-gcloud's project_id was being
        # silently ignored and every bare `gcloud` call ran against tsq-ci.
        #
        # Writing the same keys to $GITHUB_ENV again, from a LATER step, is what
        # actually wins - last write to $GITHUB_ENV takes effect.
        #
        # The symptom was a confident lie rather than an error. `gcloud run
        # services describe superadmin-api` found nothing in tsq-ci, so the
        # workflow announced "superadmin-api does not exist yet - this run
        # creates it and takes 100% traffic immediately", and later
        # "Cloud Run Job 'db-bootstrap' does not exist". Both exist, in
        # tsq-jainerp-prod. Diagnosed 2026-08-17 from the env dump in the log.
        run: |
          set -euo pipefail
          for k in CLOUDSDK_CORE_PROJECT CLOUDSDK_PROJECT GOOGLE_CLOUD_PROJECT GCLOUD_PROJECT GCP_PROJECT; do
            echo "$k=tsq-jainerp-prod" >> "$GITHUB_ENV"
          done
          echo "pinned gcloud project to tsq-jainerp-prod"

      - name: Configure Docker for Artifact Registry
        run: |
          set -euo pipefail
          host="$(echo "${{ secrets.GCP_IMAGE_REPO }}" | cut -d/ -f1)"
          gcloud auth configure-docker "$host" --quiet

      # ---------------------------------------------------------------------
      # Build.
      #
      # The tag is the commit SHA, and only the SHA. The Artifact Registry repo
      # is created with immutable_tags = true, so re-running this workflow on
      # the same commit would otherwise fail on the push. Instead: if the SHA
      # tag is already there, reuse it. Re-running a deploy is then idempotent
      # and cannot quietly ship a different build of the same commit.
      #
      # :latest is never pushed and never deployed (§5).
      # ---------------------------------------------------------------------
      - name: Resolve or build the image
        id: image
        env:
          IMAGE: ${{ secrets.GCP_IMAGE_REPO }}/mandir-web
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if digest="$(gcloud artifacts docker images describe "$IMAGE:$SHA" \
                        --format='value(image_summary.digest)' 2>/dev/null)" \
             && [ -n "$digest" ]; then
            echo "image for $SHA already in Artifact Registry, reusing $digest"
          else
