server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Proxy API calls to mandir-api (global prefix api/v1). ^~ so no regex
    # location below (the nested-assets rule) can ever take an API request.
    location ^~ /api {
        # Docker's embedded DNS — re-resolve on each request instead of
        # caching the upstream IP for the worker's lifetime (that cache
        # goes stale if mandir-api is recreated/redeployed).
        resolver 127.0.0.11 valid=10s;
        set $mandiradmin_api mandir-api;
        proxy_pass http://$mandiradmin_api:3106;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Content-hashed build assets (Vite emits /assets/*-[hash].js|css) — the
    # filename changes whenever the content does, so they're safe to cache
    # forever. A missing asset 404s rather than falling back to index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # A relative-base build (base './', which the desktop apps need) asks for
    # /staff/assets/... when a page two segments deep is reloaded. The image is
    # built with an absolute base now (Dockerfile WEB_BASE), but should one
    # ever be built without it, serve the real asset rather than letting the
    # SPA fallback answer a script request with index.html - which is the
    # "Expected a JavaScript module script ... text/html" reload error.
    location ~ ^/.+/assets/(.+)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files /assets/$1 =404;
    }

    # SPA fallback. index.html is NOT content-hashed and points at the current
    # build's hashed assets, so it must never be cached — otherwise a browser
    # keeps loading a stale index.html (and thus the old JS bundle) after a
    # new deploy. no-cache = always revalidate, so updates show on next reload.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
