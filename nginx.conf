server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Proxy API calls to mandiradmin-api (global prefix api/v1)
    location /api {
        # Docker's embedded DNS — re-resolve on each request instead of
        # caching the upstream IP for the worker's lifetime (that cache
        # goes stale if mandiradmin-api is recreated/redeployed).
        resolver 127.0.0.11 valid=10s;
        set $mandiradmin_api mandiradmin-api;
        proxy_pass http://$mandiradmin_api:3106;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
